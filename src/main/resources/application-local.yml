spring:
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:localhost}:${ORACLE_PORT:1522}/${ORACLE_DB:FREEPDB1}
    username: ${ORACLE_USER:bank}
    password: ${ORACLE_PASSWORD:bank1234}
    driver-class-name: oracle.jdbc.OracleDriver

  docker:
    compose:
      enabled: false

  mvc:
    problemdetails:
      enabled: false

  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: mappings

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: TRACE

server:
  port: 8090
